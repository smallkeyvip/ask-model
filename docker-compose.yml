services:
  ask-model:
    build: .
    ports:
      - "${PORT:-8010}:${PORT:-8010}"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_data
      - auth_data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.getenv('PORT', '8010'); urllib.request.urlopen(f'http://127.0.0.1:{port}/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  chroma_data:
  auth_data:
