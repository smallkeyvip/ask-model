services:
  ask-model:
    build: .
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./chroma_data:/app/chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
